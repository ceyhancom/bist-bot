name: BIST Bot

on:
  schedule:
    # Türkiye saati 09:30 - gün öncesi değerlendirme
    - cron: "30 6 * * 1-5"

    # Türkiye saati 10:00 - 17:45 arası her 15 dakika
    - cron: "*/15 7-14 * * 1-5"

    # Türkiye saati 18:10 - gün sonu değerlendirme
    - cron: "10 15 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu: auto / morning / scan / evening"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python bot.py

      - name: Günlük sinyal kaydını sakla
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.json || true
          git commit -m "Günlük sinyal kaydı güncellendi" || echo "Kaydedilecek değişiklik yok"
          git push || echo "Push yapılmadı"
