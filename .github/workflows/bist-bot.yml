name: BIST Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Manuel analiz edilecek hisse. Örn: TAVHL veya TAVHL.IS"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.symbol }}" ]; then
            python bot.py "${{ github.event.inputs.symbol }}"
          else
            python bot.py
          fi

      - name: Save bot memory files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add signal_memory.json gunluk_sinyaller.json performance.json open_trades.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "update bot memory"
            git pull --rebase || true
            git push || true
          fi
