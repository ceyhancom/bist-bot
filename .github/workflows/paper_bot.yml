:::writing{variant="standard" id="fixed_yaml_01"}
name: Paper Trade Bot

on:
  schedule:
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Paketleri yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu çalıştır
        run: |
          python paper_bot.py
:::
